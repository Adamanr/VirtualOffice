# Production-like stack: Caddy (HTTPS, static client, reverse proxy) + Phoenix + LiveKit.
# All services use host networking: LiveKit needs a large UDP port range
# (50000-60000) and publishing it through docker-proxy is slow and fragile.
# Usage: cp .env.example .env && edit && docker compose up -d --build
name: virtual-office

services:
  livekit:
    image: docker.io/livekit/livekit-server:v1.9
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    network_mode: host
    environment:
      # "key: secret" pairs; must match what Phoenix signs tokens with.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  phoenix:
    build:
      context: ..
      dockerfile: server/Dockerfile
    network_mode: host
    environment:
      PHX_SERVER: "true"
      PHX_HOST: ${DOMAIN}
      PHX_IP: 127.0.0.1
      PORT: 4000
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      BROWSER_SECRET: ${BROWSER_SECRET}
      LEVEL_PATH: /app/shared/level.json
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  # Headless Chromium for "open any site" on office computers. Its traffic goes
  # through a built-in filtering proxy: public internet only (no SSRF to LAN,
  # localhost or cloud metadata).
  browser:
    build:
      context: ../browser
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: 4100
      BROWSER_SECRET: ${BROWSER_SECRET}
      MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-6}
      # Chrome Web Store extensions installed by people in the office (0 = off).
      EXTENSIONS: ${BROWSER_EXTENSIONS:-1}
    volumes:
      - extensions:/data/extensions
    shm_size: 1gb
    restart: unless-stopped

  caddy:
    build:
      context: ..
      dockerfile: infra/caddy.Dockerfile
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [phoenix, livekit, browser]
    restart: unless-stopped

volumes:
  uploads:
  extensions:
  caddy_data:
  caddy_config:
